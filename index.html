<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#263238">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>הסד"פים שלי</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f2f4f3;color:#182126}
header{background:#263238;color:#fff;padding:16px 15px 18px;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px #0002}
.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:24px}.sub{font-size:12px;color:#bdc7ca;margin-top:2px}
.iconbtn{border:0;background:#455a64;color:#fff;border-radius:12px;padding:9px 11px;font-size:18px}.search{margin-top:14px;width:100%;padding:14px 15px;border:0;border-radius:13px;font-size:17px;outline:none}
main{max-width:760px;margin:auto;padding:15px 14px 100px}.hero{background:#fff;border:1px solid #dde3e5;border-radius:16px;padding:15px;margin-bottom:15px}.hero b{font-size:17px}.hero p{margin:5px 0 0;color:#68767c;font-size:13px}
.section{font-weight:800;color:#5e6b70;margin:4px 2px 10px}.result{font-size:13px;color:#748087;margin:-4px 2px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:1px solid #dce2e4;background:#fff;border-radius:15px;padding:15px;min-height:105px;text-align:right;box-shadow:0 2px 8px #00000009;cursor:pointer}.card:active{transform:scale(.985)}.icon{font-size:22px;margin-bottom:8px}.card h3{font-size:16px;margin:0;line-height:1.3}.count{font-size:12px;color:#77848a;margin-top:6px}.star{float:left;font-size:18px}
.empty{text-align:center;padding:40px 10px;color:#748087}.back{border:0;background:#e5eaec;border-radius:10px;padding:9px 12px;margin-bottom:13px}.title-row{display:flex;justify-content:space-between;align-items:center;gap:10px}.title-row h2{margin:0;font-size:24px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{border:0;border-radius:10px;padding:10px 13px;background:#37474f;color:#fff;font:inherit}.btn.light{background:#e7ecee;color:#263238}.btn.danger{background:#b23b3b}
.step{background:#fff;border:1px solid #dfe4e6;border-radius:12px;padding:13px;margin:8px 0;display:flex;gap:10px;align-items:flex-start}.num{min-width:29px;height:29px;border-radius:50%;background:#455a64;color:#fff;display:grid;place-items:center;font-weight:800}.text{line-height:1.55;white-space:pre-wrap;flex:1}.check{min-width:24px;height:24px}
.progress{height:7px;background:#e1e6e7;border-radius:10px;overflow:hidden;margin:12px 0}.bar{height:100%;width:0;background:#607d6f;transition:.2s}.status{font-size:13px;color:#6e7a7f}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:30}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.sheet h3{margin:0 0 15px}.field{margin:11px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #cfd7da;border-radius:10px;font:inherit}.field textarea{min-height:180px}.modal-actions{display:flex;gap:8px;margin-top:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dce1e3;padding:7px 8px;display:flex;justify-content:center;gap:4px;z-index:20}.navbtn{border:0;background:none;padding:8px 14px;font:inherit;font-size:14px}
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#263238;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:50;font-size:14px}
.listrow{display:flex;gap:8px;align-items:center;margin:8px 0}.listrow input{flex:1}.mini{border:0;background:#e8edef;border-radius:9px;padding:10px}.note{font-size:12px;color:#758188;line-height:1.5}
@media(max-width:420px){.grid{grid-template-columns:1fr}.card{min-height:78px}}
</style>
</head>
<body>
<header><div class="top"><div><div class="brand">הסד"פים שלי</div><div class="sub">מאגר אישי • גרסה 1.2</div></div><button class="iconbtn" onclick="settings()">⚙️</button></div><input id="search" class="search" placeholder='מה קורה? חפש סד"פ...' oninput="home()"></header>
<main id="app"></main>
<nav><button class="navbtn" onclick="home()">🏠 ראשי</button><button class="navbtn" onclick="favorites()">⭐ מועדפים</button><button class="navbtn" onclick="editor()">＋ הוספה</button></nav>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div><div id="toast" class="toast"></div>
<script>
let data=[{"name": "גשם סגול", "category": "אירועים", "favorite": true, "steps": ["קבלת דיווח ראשוני על האירוע (מיקום נפילות, מס נפילות)", "הכרזת \"גשם סגול\" בקשר לכלל הכוחות.", "דיווח ביומן המבצעים", "תוכרז ותופעל כוננות ספיגה בגזרות שכנות בעת הצורך", "אין יציאה ממרחבים מוגנים ללא פקודה", "ביצוע \"ירוק בעיניים\" לכלל הכוחות הגזרה", "מוכנות לקליטת נפגעים", "ציו\"ח התצפיות והכוחות שבשטח להגנה על הישובים ומרחב הגדר", "קבלת תמונת מצב על פצועים (במידה ויש)"]}, {"name": "התקרבות למוצב", "category": "מוצב", "favorite": true, "steps": ["קבלת דיווח ראשוני - מי זיהה, כמות חשודים, תיאור החשודים, מרחק מהמוצב, מה הם עושים, מגמת תנועה, סמוך לאיזה דבש", "דקירת איתור אויב במשואה", "דיווח והתראה לכוחותינו - עדכון מפקד גזרה (מגד, מסגד, מפ)", "עיבוי עמדות", "ציו\"ח כוחות איסוף לסריקה במרחב", "האזנה לרשת הרלוונטית (גדודית)", "עדכון כוחות רלוונטים במרחב", "הערכת מצב להפעלת כוננות 2", "התעדכנות על נוהל פתיחה באש - ס/מגד", "קבלת חזלש ע\"י מגד"]}, {"name": "חדירה למוצב", "category": "מוצב", "favorite": true, "steps": ["קבלת דיווח - מאיזה כיוון, כמה אנשים, מה האמלח", "דיווח לכוחות במוצב/סמוך למוצב", "הפעלת מצב כוננות 3", "דיווח בקשר + עדכון מפקד גזרה + הכרזה בכריזה + עדכון החמל הגדודי", "הקפצת כיתת כוננות לנקודה, כוחות עתודה גדודים, מחלקת ניוד בכוננות", "הפעלת סיוע קרבי, כפתור אדום, איסוף, פלסר, זיק, רוכש, מסוק במידת הצורך", "גיבוש תמונות מצב", "קבלת חזלש ע\"י מגד"]}, {"name": "נוהל חומה", "category": "הגנת מרחב", "favorite": false, "steps": ["הכזרת חומה ע\"י מפקד הגזרה", "יציאת סדכ לעמדות", "וידוא תצפיות ורחפן בקשר עין עם המרחב", "ביצוע ירי למרחבים חשודים או בהתאם לזיהוי", "במידה ויש סגירת מעגל - קבלת אישור מגד לביצוע ירי."]}, {"name": "פטיש חם/ירי צליפה", "category": "ירי", "favorite": false, "steps": ["דיווח ראשוני לגבי מקום האירוע, מהיכן היה הירי, דיווח על נפגעים", "עדכון מפקד גזרה", "ניסיון לזיהוי האויב והסרת האיום", "הפעלת מצב כוננות 2", "במידה ויש פצועים - עדכון לד\"ר, הקפצת ה - 6", "ציו\"ח תצפיות", "גיבוש תמונת מצב", "האזנה לקשר הגדודי", "העלאת דרישות לחטיבה - איסוף, זיק, רוכש, מסוק - במידת הצורך", "הקפצת כוחות מעטפת נוספים מהגזרות השכנות במידת הצורך", "עדכון ביומן מבצעים"]}, {"name": "פטיש אוויר", "category": "אוויר", "favorite": false, "steps": ["דיווח בקשר - מי מזהה, מגמת טיסה, בעל יכולת הטלה וכו'", "הפעל מצב כוננות 2", "דיווח בקשר הגדודי", "קיפול כלל הכוחות למרחבים מוגנים", "וידוא \"ירוק בעיניים\"", "קבלת חזלש ע\"י מפקד גזרה"]}]; let current=-1,checks=[];
function save(){localStorage.setItem("sdap_data_final",JSON.stringify(data))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function home(){let q=document.getElementById("search").value.trim().toLowerCase();let items=data.map((p,i)=>({p,i})).filter(x=>!q||x.p.name.toLowerCase().includes(q)||x.p.category.toLowerCase().includes(q)||x.p.steps.some(s=>s.toLowerCase().includes(q)));items.sort((a,b)=>Number(b.p.favorite)-Number(a.p.favorite));let a=document.getElementById("app");a.innerHTML='<div class="hero"><b>⚡ מה קורה?</b><p>חיפוש לפי שם, קטגוריה או מילה מתוך הסד"פ. ⭐ מועדפים מופיעים ראשונים.</p></div><div class="section">'+(q?'תוצאות חיפוש':'כל הסד"פים')+'</div>'+(q?'<div class="result">נמצאו '+items.length+' תוצאות</div>':'');if(!items.length){a.innerHTML+='<div class="empty">לא נמצאו סד"פים.<br>נסה חיפוש אחר.</div>';return}let g=document.createElement("div");g.className="grid";items.forEach(x=>{let b=document.createElement("button");b.className="card";b.innerHTML='<span class="star">'+(x.p.favorite?'⭐':'☆')+'</span><div class="icon">📋</div><h3>'+esc(x.p.name)+'</h3><div class="count">'+esc(x.p.category)+' • '+x.p.steps.length+' שלבים</div>';b.onclick=()=>show(x.i);g.appendChild(b)});a.appendChild(g)}
function favorites(){document.getElementById("search").value="";let a=document.getElementById("app");a.innerHTML='<div class="section">⭐ מועדפים</div>';let arr=data.map((p,i)=>({p,i})).filter(x=>x.p.favorite);if(!arr.length){a.innerHTML+='<div class="empty">אין עדיין מועדפים.</div>';return}let g=document.createElement("div");g.className="grid";arr.forEach(x=>{let b=document.createElement("button");b.className="card";b.innerHTML='<span class="star">⭐</span><div class="icon">📋</div><h3>'+esc(x.p.name)+'</h3><div class="count">'+esc(x.p.category)+' • '+x.p.steps.length+' שלבים</div>';b.onclick=()=>show(x.i);g.appendChild(b)});a.appendChild(g)}
function show(i){current=i;checks=[];let p=data[i],a=document.getElementById("app");a.innerHTML='<button class="back" onclick="home()">→ חזרה לרשימה</button><div class="title-row"><h2>'+esc(p.name)+'</h2><button class="iconbtn" onclick="fav()">'+(p.favorite?'⭐':'☆')+'</button></div><div class="status">'+esc(p.category)+' • '+p.steps.length+' שלבים</div><div class="actions"><button class="btn" onclick="start()">▶️ התחל</button><button class="btn light" onclick="editor('+i+')">✏️ עריכה</button><button class="btn light" onclick="copyIt()">📋 העתקה</button><button class="btn danger" onclick="removeIt()">🗑️ מחיקה</button></div>';draw(false)}
function draw(mode){let p=data[current],a=document.getElementById("app"),w=document.createElement("div");w.id="steps";if(mode)w.innerHTML='<div class="status" id="prog">0 מתוך '+p.steps.length+' הושלמו</div><div class="progress"><div class="bar" id="bar"></div></div>';p.steps.forEach((s,n)=>{let d=document.createElement("div");d.className="step";d.innerHTML='<span class="num">'+(n+1)+'</span><span class="text">'+esc(s)+'</span>'+(mode?'<input class="check" type="checkbox" onchange="tick('+n+',this.checked)">':'');w.appendChild(d)});a.appendChild(w)}
function start(){checks=[];let old=document.getElementById("steps");if(old)old.remove();draw(true);toast("מצב ביצוע הופעל")}
function tick(n,v){checks[n]=v;let d=checks.filter(Boolean).length,t=data[current].steps.length;document.getElementById("prog").textContent=d+" מתוך "+t+" הושלמו";document.getElementById("bar").style.width=(d/t*100)+"%";if(d===t)toast("כל השלבים סומנו")}
function fav(){data[current].favorite=!data[current].favorite;save();show(current)}
function editor(i=null){let p=i===null?{name:"",category:"כללי",steps:[]}:data[i];openModal('<h3>'+ (i===null?'➕ הוספת סד"פ':'✏️ עריכת סד"פ')+'</h3><div class="field"><label>שם</label><input id="en" value="'+esc(p.name)+'"></div><div class="field"><label>קטגוריה</label><input id="ec" value="'+esc(p.category)+'"></div><div class="field"><label>שלבים — שורה לכל שלב</label><textarea id="es">'+esc(p.steps.join("\n"))+'</textarea></div><div class="modal-actions"><button class="btn" onclick="saveEdit('+(i===null?'null':i)+')">💾 שמירה</button><button class="btn light" onclick="closeModal()">ביטול</button></div>')}
function saveEdit(i){let n=document.getElementById("en").value.trim(),c=document.getElementById("ec").value.trim()||"כללי",s=document.getElementById("es").value.split("\n").map(x=>x.trim()).filter(Boolean);if(!n){toast("יש להזין שם");return}if(i===null)data.push({name:n,category:c,steps:s,favorite:false});else data[i]={...data[i],name:n,category:c,steps:s};save();closeModal();home();toast("נשמר")}
function removeIt(){if(confirm("למחוק את הסד"פ?")){data.splice(current,1);save();current=-1;home();toast("נמחק")}}
function copyIt(){let p=data[current],t=p.name+"\n"+p.steps.map((s,i)=>(i+1)+". "+s).join("\n");navigator.clipboard?.writeText(t);toast("הועתק")}
function settings(){openModal('<h3>⚙️ הגדרות</h3><p class="note">הנתונים נשמרים מקומית במכשיר. מומלץ לבצע גיבוי לפני החלפת מכשיר.</p><div class="actions"><button class="btn" onclick="backup()">📤 גיבוי</button><button class="btn light" onclick="document.getElementById("file").click()">📥 שחזור</button></div><input id="file" type="file" accept=".json" style="display:none" onchange="restore(this)"><button class="btn light" onclick="closeModal()">סגור</button>')}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="sdap-backup.json";a.click();toast("נוצר גיבוי")}
function restore(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;data=x;save();closeModal();home();toast("השחזור הצליח")}catch(e){toast("קובץ לא תקין")}};r.readAsText(f)}
function openModal(x){document.getElementById("sheet").innerHTML=x;document.getElementById("modal").classList.add("show")}function closeModal(){document.getElementById("modal").classList.remove("show")}function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1600)}home();
</script></body></html>
